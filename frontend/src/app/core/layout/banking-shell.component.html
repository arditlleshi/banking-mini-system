<div hlmSidebarWrapper class="relative min-h-screen">
  <a
    href="#main-content"
    class="absolute left-4 top-4 z-80 translate-y-[-180%] rounded-lg bg-card px-4 py-2.5 text-foreground no-underline [box-shadow:var(--surface-shadow-skip-link)] transition-transform duration-200 focus-visible:translate-y-0"
  >
    Skip to main content
  </a>
  <hlm-sidebar
    variant="sidebar"
    collapsible="icon"
    side="left"
    sidebarContainerClass="max-lg:p-0"
    aria-label="Primary navigation"
  >
    <div hlmSidebarHeader class="px-3 pt-3 pb-2">
      <section class="flex items-center gap-3 group-data-[collapsible=icon]:justify-center">
        <div
          aria-hidden="true"
          class="inline-flex h-10 w-10 items-center justify-center rounded-lg text-sidebar-foreground [background:var(--surface-sidebar-badge)] [box-shadow:inset_0_1px_0_var(--surface-inset-highlight)] group-data-[collapsible=icon]:hidden"
        >
          <ng-icon hlm name="lucideBuilding2" size="sm"></ng-icon>
        </div>
        <div class="min-w-0 group-data-[collapsible=icon]:hidden">
          <p class="text-base font-bold leading-tight text-sidebar-foreground">Acme Bank</p>
          <p class="mt-0.5 text-sm leading-tight text-sidebar-foreground/85">Enterprise desk</p>
        </div>
        <button
          hlmSidebarTrigger
          type="button"
          class="ml-auto rounded-lg border border-sidebar-border/70 text-sidebar-foreground/80 shadow-none [background:var(--surface-sidebar-toggle)] group-data-[collapsible=icon]:ml-0 group-data-[collapsible=icon]:size-9 group-data-[collapsible=icon]:p-0"
          aria-label="Toggle sidebar"
        ></button>
      </section>
    </div>
    <div hlmSidebarContent class="gap-1 p-1.5 pt-4">
      <section hlmSidebarGroup class="p-0">
        <div
          hlmSidebarGroupLabel
          class="px-3.5 pb-2.5 text-[0.92rem] font-bold normal-case tracking-normal text-sidebar-foreground/65"
        >
          Platform
        </div>
        <div hlmSidebarGroupContent>
          <ul
            hlmSidebarMenu
            class="flex flex-col gap-1 group-data-[collapsible=icon]:items-center"
            aria-label="Platform"
          >
            @for (item of navigation(); track item.path) {
              <li
                hlmSidebarMenuItem
                class="group-data-[collapsible=icon]:flex group-data-[collapsible=icon]:justify-center"
              >
                <a
                  hlmSidebarMenuButton
                  [routerLink]="item.path"
                  [isActive]="matchesRoute(item.path, item.exact ?? false)"
                  [tooltip]="item.label"
                  class="border-0 bg-transparent px-3 py-2.5 text-sidebar-foreground/96"
                >
                  <ng-icon hlm [name]="item.icon" size="sm"></ng-icon>
                  <span class="text-base leading-tight">{{ item.label }}</span>
                </a>
              </li>
            }
          </ul>
        </div>
      </section>
    </div>
    <div
      hlmSidebarFooter
      class="p-3 group-data-[collapsible=icon]:items-center group-data-[collapsible=icon]:justify-center group-data-[collapsible=icon]:px-1 group-data-[collapsible=icon]:py-2"
    >
      <button
        hlmBtn
        type="button"
        variant="ghost"
        class="w-full min-h-15 justify-start gap-3 rounded-lg border border-sidebar-border/65 px-3 py-2.5 [background:var(--surface-sidebar-shell)] group-data-[collapsible=icon]:mx-auto group-data-[collapsible=icon]:size-10 group-data-[collapsible=icon]:min-h-10 group-data-[collapsible=icon]:justify-center group-data-[collapsible=icon]:gap-0 group-data-[collapsible=icon]:px-0 group-data-[collapsible=icon]:py-0"
        [hlmDropdownMenuTrigger]="profileMenu"
        side="top"
        align="start"
      >
        <span
          aria-hidden="true"
          class="inline-flex h-8.5 w-8.5 items-center justify-center rounded-full text-[0.78rem] font-bold tracking-[0.06em] text-sidebar-foreground/92 [background:var(--surface-sidebar-avatar)] group-data-[collapsible=icon]:h-8 group-data-[collapsible=icon]:w-8"
        >
          {{ userInitials() }}
        </span>
        <span
          class="inline-flex min-w-0 flex-col items-start gap-0.5 group-data-[collapsible=icon]:hidden"
        >
          <span class="text-base font-bold leading-tight text-sidebar-foreground"
            >Ardit Lleshi</span
          >
        </span>
        <span
          aria-hidden="true"
          class="ml-auto text-sidebar-foreground/65 group-data-[collapsible=icon]:hidden"
        >
          <ng-icon hlm name="lucideChevronUp" size="sm"></ng-icon>
        </span>
      </button>
      <ng-template #profileMenu>
        <div hlmDropdownMenu class="min-w-64">
          <div hlmDropdownMenuLabel class="text-[0.74rem] uppercase tracking-[0.12em]">
            Account controls
          </div>
          <div hlmDropdownMenuSeparator></div>
          <div hlmDropdownMenuItem class="cursor-default">
            <label
              hlmLabel
              for="sidebar-theme-mode"
              class="flex w-full items-center justify-between gap-4"
            >
              <span class="inline-flex flex-col gap-0.5">
                <span class="text-sm font-semibold">Theme</span>
                <span class="text-xs text-muted-foreground">Switch appearance</span>
              </span>
              <hlm-switch
                inputId="sidebar-theme-mode"
                [checked]="theme.isDark()"
                (checkedChange)="toggleTheme($event)"
                aria-label="Toggle color theme"
              />
            </label>
          </div>
          <div hlmDropdownMenuSeparator></div>
          <button hlmDropdownMenuItem type="button" variant="destructive" (triggered)="logout()">
            <ng-icon hlm name="lucideLogOut" size="sm"></ng-icon> Sign out
          </button>
        </div>
      </ng-template>
    </div>
  </hlm-sidebar>
  <main id="main-content" hlmSidebarInset class="min-w-0" tabindex="-1">
    <header
      class="sticky top-0 z-30 border-b border-border/70 px-4 py-3 [background:color-mix(in_oklab,var(--background)_88%,var(--card)_12%)] [box-shadow:var(--surface-shadow)] backdrop-blur-[18px] sm:px-6 lg:px-10"
    >
      <div class="mx-auto flex min-h-10 w-full max-w-6xl items-center">
        <app-page-breadcrumb [items]="breadcrumbItems()" aria-label="Current page path" />
      </div>
    </header>
    <div class="min-w-0 p-3.5 max-lg:p-3"><router-outlet /></div>
  </main>
</div>
