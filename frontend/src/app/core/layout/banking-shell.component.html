<div hlmSidebarWrapper class="relative min-h-screen">
  <a
    href="#main-content"
    class="absolute left-4 top-4 z-80 translate-y-[-180%] rounded-lg bg-card px-4 py-2.5 text-foreground no-underline shadow-[0_18px_40px_-30px_rgba(15,23,42,0.45)] transition-transform duration-200 focus-visible:translate-y-0"
  >
    Skip to main content
  </a>

  <hlm-sidebar
    variant="sidebar"
    collapsible="icon"
    side="left"
    sidebarContainerClass="max-lg:p-0"
    aria-label="Primary navigation"
  >
    <div hlmSidebarHeader class="px-3 pt-3 pb-2">
      <section class="flex items-center gap-3 group-data-[collapsible=icon]:justify-center">
        <div
          aria-hidden="true"
          class="inline-flex h-10 w-10 items-center justify-center rounded-lg bg-[color-mix(in_oklab,white_92%,var(--sidebar-accent)_8%)] text-sidebar-foreground/95 shadow-[inset_0_1px_0_rgba(255,255,255,0.32)] group-data-[collapsible=icon]:hidden"
        >
          <ng-icon hlm name="lucideBuilding2" size="sm"></ng-icon>
        </div>

        <div class="min-w-0 group-data-[collapsible=icon]:hidden">
          <p class="text-base font-bold leading-tight text-sidebar-foreground">Acme Bank</p>
          <p class="mt-0.5 text-sm leading-tight text-sidebar-foreground/85">Enterprise desk</p>
        </div>

        <button
          hlmSidebarTrigger
          type="button"
          class="ml-auto rounded-lg bg-sidebar/70 text-sidebar-foreground/75 shadow-none group-data-[collapsible=icon]:ml-0 group-data-[collapsible=icon]:size-8 group-data-[collapsible=icon]:p-0"
          aria-label="Toggle sidebar"
        >
        </button>
      </section>
    </div>

    <div hlmSidebarContent class="gap-1 p-1.5 pt-4">
      <section hlmSidebarGroup class="p-0">
        <div hlmSidebarGroupLabel class="px-3.5 pb-2.5 text-[0.92rem] font-bold normal-case tracking-normal text-sidebar-foreground/65">
          Platform
        </div>

        <div hlmSidebarGroupContent>
          <ul hlmSidebarMenu class="flex flex-col gap-1 group-data-[collapsible=icon]:items-center" aria-label="Platform">
            @for (item of navigation(); track item.path) {
              <li hlmSidebarMenuItem class="group-data-[collapsible=icon]:flex group-data-[collapsible=icon]:justify-center">
                <a
                  hlmSidebarMenuButton
                  [routerLink]="item.path"
                  [isActive]="matchesRoute(item.path, item.exact ?? false)"
                  [tooltip]="item.label"
                  class="rounded-lg border-0 bg-transparent px-3 py-2 text-sidebar-foreground/95 transition-colors duration-150 hover:bg-[color-mix(in_oklab,var(--sidebar-accent)_34%,var(--sidebar)_66%)] focus-visible:bg-[color-mix(in_oklab,var(--sidebar-accent)_34%,var(--sidebar)_66%)] active:bg-[color-mix(in_oklab,var(--sidebar-accent)_46%,var(--sidebar)_54%)] data-[active=true]:bg-[color-mix(in_oklab,var(--sidebar-accent)_34%,var(--sidebar)_66%)] data-[active=true]:hover:bg-[color-mix(in_oklab,var(--sidebar-accent)_34%,var(--sidebar)_66%)] data-[active=true]:active:bg-[color-mix(in_oklab,var(--sidebar-accent)_46%,var(--sidebar)_54%)]"
                >
                  <ng-icon hlm [name]="item.icon" size="sm"></ng-icon>
                  <span class="text-base leading-tight">{{ item.label }}</span>
                </a>
                <span hlmSidebarMenuBadge class="text-[0.73rem] font-bold tracking-[0.12em] text-sidebar-foreground/55">{{ item.badge }}</span>
              </li>
            }
          </ul>
        </div>
      </section>
    </div>

    <div hlmSidebarFooter class="p-3 group-data-[collapsible=icon]:items-center group-data-[collapsible=icon]:justify-center group-data-[collapsible=icon]:px-1 group-data-[collapsible=icon]:py-2">
      <button
        hlmBtn
        type="button"
        variant="ghost"
        class="w-full min-h-15 justify-start gap-3 rounded-lg bg-[linear-gradient(180deg,color-mix(in_oklab,var(--sidebar)_96%,white_4%),color-mix(in_oklab,var(--sidebar)_90%,transparent))] px-3 py-2.5 group-data-[collapsible=icon]:mx-auto group-data-[collapsible=icon]:size-10 group-data-[collapsible=icon]:min-h-10 group-data-[collapsible=icon]:justify-center group-data-[collapsible=icon]:gap-0 group-data-[collapsible=icon]:px-0 group-data-[collapsible=icon]:py-0"
        [hlmDropdownMenuTrigger]="profileMenu"
        side="top"
        align="start"
      >
        <span
          aria-hidden="true"
          class="inline-flex h-8.5 w-8.5 items-center justify-center rounded-full bg-[color-mix(in_oklab,white_92%,var(--sidebar-accent)_8%)] text-[0.78rem] font-bold tracking-[0.06em] text-sidebar-foreground/92 group-data-[collapsible=icon]:h-8 group-data-[collapsible=icon]:w-8"
        >
          {{ userInitials() }}
        </span>

        <span class="inline-flex min-w-0 flex-col items-start gap-0.5 group-data-[collapsible=icon]:hidden">
          <span class="text-base font-bold leading-tight text-sidebar-foreground">Ardit Lleshi</span>
        </span>

        <span aria-hidden="true" class="ml-auto text-sidebar-foreground/65 group-data-[collapsible=icon]:hidden">
          <ng-icon hlm name="lucideChevronUp" size="sm"></ng-icon>
        </span>
      </button>

      <ng-template #profileMenu>
        <div hlmDropdownMenu class="min-w-64">
          <div hlmDropdownMenuLabel class="text-[0.74rem] uppercase tracking-[0.12em]">Account controls</div>
          <div hlmDropdownMenuSeparator></div>

          <div hlmDropdownMenuItem class="cursor-default">
            <label hlmLabel for="sidebar-theme-mode" class="flex w-full items-center justify-between gap-4">
              <span class="inline-flex flex-col gap-0.5">
                <span class="text-sm font-semibold">Theme</span>
                <span class="text-xs text-muted-foreground">Switch appearance</span>
              </span>
              <hlm-switch
                inputId="sidebar-theme-mode"
                [checked]="theme.isDark()"
                (checkedChange)="toggleTheme($event)"
                aria-label="Toggle color theme"
              />
            </label>
          </div>

          <div hlmDropdownMenuSeparator></div>

          <button hlmDropdownMenuItem type="button" variant="destructive" (triggered)="logout()">
            <ng-icon hlm name="lucideLogOut" size="sm"></ng-icon>
            Sign out
          </button>
        </div>
      </ng-template>
    </div>
  </hlm-sidebar>

  <main id="main-content" hlmSidebarInset class="min-w-0" tabindex="-1">
    <header
      class="sticky top-0 z-30 flex items-center gap-4 bg-[linear-gradient(180deg,color-mix(in_oklab,var(--background)_92%,transparent),transparent_86%)] px-4 pt-4 backdrop-blur-[10px] max-lg:px-3.5 max-lg:pt-3.5"
    >
      <div class="flex min-w-0 flex-col gap-1.5">
        <p class="text-xs font-semibold uppercase tracking-[0.24em] text-muted-foreground">Current workspace</p>
        <div>
          <h1 class="font-display text-[clamp(1.8rem,2vw,2.5rem)] leading-[0.96]">{{ activeItem().label }}</h1>
          <p class="text-[0.96rem] leading-relaxed text-muted-foreground">
            Operational surface for approvals, servicing, and client context.
          </p>
        </div>
      </div>
    </header>

    <div class="min-w-0 p-4 max-lg:p-3.5">
      <router-outlet />
    </div>
  </main>
</div>
