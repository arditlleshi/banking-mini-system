<section class="min-h-screen bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-100 px-6 py-10 grid place-items-center">
  <form
    class="w-full max-w-sm rounded-2xl border border-blue-100 bg-white/95 p-6 shadow-xl shadow-blue-900/10 backdrop-blur-sm space-y-4"
    [formGroup]="form"
    (ngSubmit)="submit()"
  >
    <h1 class="text-2xl font-semibold tracking-tight text-slate-900">Sign in</h1>

    <label class="block space-y-1 text-sm font-medium text-slate-700">
      Username
      <input
        class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-slate-900 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
        type="text"
        formControlName="username"
        autocomplete="username"
      />
    </label>

    <label class="block space-y-1 text-sm font-medium text-slate-700">
      Password
      <input
        class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-slate-900 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
        type="password"
        formControlName="password"
        autocomplete="current-password"
      />
    </label>

    @if (errorMessage()) {
      <p class="text-sm font-medium text-red-700">{{ errorMessage() }}</p>
    }

    <button
      class="w-full rounded-lg bg-blue-600 px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-blue-700 disabled:cursor-not-allowed disabled:opacity-70"
      type="submit"
      [disabled]="loading()"
    >
      {{ loading() ? 'Signing in...' : 'Sign in' }}
    </button>
  </form>
</section>
