<main class="mx-auto max-w-4xl px-4 py-8 sm:px-6">
  <header class="mb-6 flex items-center justify-between gap-3">
    <h1 class="text-2xl font-semibold tracking-tight text-slate-900">Banking Mini System</h1>
    <button
      class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm font-medium text-slate-700 transition hover:bg-slate-100"
      type="button"
      (click)="logout()"
    >
      Sign out
    </button>
  </header>

  <p class="mb-4 text-sm text-slate-600">{{ status() }}</p>

  @if (items().length > 0) {
    <section class="rounded-xl border border-slate-200 bg-white p-4 shadow-sm">
      <h2 class="mb-3 text-lg font-medium text-slate-900">Items from Backend</h2>
      <ul class="list-disc space-y-1 pl-5 text-slate-700">
        @for (item of items(); track item.id) {
          <li>{{ item.id }} - {{ item.name }}</li>
        }
      </ul>
    </section>
  }
</main>
